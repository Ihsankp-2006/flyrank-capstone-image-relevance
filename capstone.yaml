name: FlyRank AI Image Understanding & Content Matching Engine
description: FastAPI backend for image understanding, content matching, review workflows, and offline evaluation.

run: docker compose up -d

seed: .venv\Scripts\python.exe -m scripts.import_evaluation_dataset

test: .venv\Scripts\python.exe -m pytest -q

base_url: http://localhost:8000

endpoints:
  - GET /
  - GET /health
  - GET /api/images/
  - POST /api/images/upload
  - POST /api/images/process
  - GET /api/images/{image_id}
  - DELETE /api/images/{image_id}
  - GET /api/images/{image_id}/status
  - POST /api/posts/
  - GET /api/posts/{post_id}
  - POST /api/posts/{post_id}/suggestions
  - GET /api/posts/{post_id}/suggestions
  - GET /api/suggestions/{suggestion_id}
  - POST /api/suggestions/{suggestion_id}/approve
  - POST /api/suggestions/{suggestion_id}/reject